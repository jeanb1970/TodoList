<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList — Sérénité & Organisation</title>
    <meta name="description" content="Une application de gestion de tâches simple, efficace et épurée au design paisible.">
    <!-- Police Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- En-tête apaisant -->
        <header class="app-header">
            <div class="header-brand">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div>
                    <h1>TodoList</h1>
                    <p class="subtitle">Espace d'organisation simple & paisible</p>
                </div>
            </div>
            <div class="stats-summary" id="statsSummary">
                <div class="stat-pill">
                    <span class="stat-value" id="countTotal">0</span>
                    <span class="stat-label">Tâches</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-pill">
                    <span class="stat-value" id="countActive">0</span>
                    <span class="stat-label">En cours</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-pill">
                    <span class="stat-value" id="countCompleted">0</span>
                    <span class="stat-label">Terminées</span>
                </div>
            </div>
        </header>

        <!-- Formulaire d'ajout rapide -->
        <section class="task-form-card">
            <form id="taskForm" class="task-form">
                <div class="form-main-row">
                    <div class="input-wrapper">
                        <input type="text" id="taskTitle" placeholder="Ajouter une nouvelle tâche..." required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Ajouter</span>
                    </button>
                </div>

                <div class="form-details-row">
                    <div class="form-group">
                        <label for="taskDesc">Notes / Description</label>
                        <input type="text" id="taskDesc" placeholder="Détails optionnels..." autocomplete="off">
                    </div>

                    <div class="form-group form-group-sm">
                        <label for="taskPriority">Priorité</label>
                        <select id="taskPriority">
                            <option value="low">Basse</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>

                    <div class="form-group form-group-sm">
                        <label for="taskDueDate">Échéance</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
            </form>
        </section>

        <!-- Barre de filtres et d'outils -->
        <section class="toolbar">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">Toutes</button>
                <button class="filter-btn" data-filter="active">En cours</button>
                <button class="filter-btn" data-filter="completed">Terminées</button>
            </div>

            <div class="toolbar-actions">
                <div class="select-wrapper">
                    <select id="priorityFilter" class="secondary-select">
                        <option value="">Toutes les priorités</option>
                        <option value="high">Haute priorité</option>
                        <option value="medium">Priorité moyenne</option>
                        <option value="low">Basse priorité</option>
                    </select>
                </div>

                <div class="select-wrapper">
                    <select id="sortSelect" class="secondary-select">
                        <option value="created_desc">Plus récentes</option>
                        <option value="created_asc">Plus anciennes</option>
                        <option value="due_date">Par échéance</option>
                        <option value="priority">Par priorité</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Liste des tâches -->
        <main class="tasks-container">
            <ul id="taskList" class="task-list"></ul>
            
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon">🌱</div>
                <h3>Votre esprit est serein</h3>
                <p id="emptyStateText">Aucune tâche enregistrée pour le moment. Profitez de cet instant ou ajoutez une tâche.</p>
            </div>
        </main>
    </div>

    <!-- Modal d'édition de tâche -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Modifier la tâche</h2>
                <button type="button" class="btn-icon" id="closeModalBtn">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <label for="editTaskTitle">Titre</label>
                    <input type="text" id="editTaskTitle" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="editTaskDesc">Description</label>
                    <textarea id="editTaskDesc" rows="3"></textarea>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="editTaskPriority">Priorité</label>
                        <select id="editTaskPriority">
                            <option value="low">Basse</option>
                            <option value="medium">Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editTaskDueDate">Date d'échéance</label>
                        <input type="date" id="editTaskDueDate">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
